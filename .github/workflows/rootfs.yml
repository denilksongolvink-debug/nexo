name: Build Rootfs (arm64)

on:
  push:
    tags:
      - 'rootfs-*'

permissions:
  contents: read
  packages: write

env:
  HERMES_REF: v0.23.0
  PYTHON_VERSION: '3.11'
  EXTRAS_MINIMOS: web,mcp,acp,cron,uvloop

jobs:
  build:
    name: Build rootfs-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Build rootfs
        id: build
        run: |
          cd rootfs
          echo "HERMES_REF=${HERMES_REF}" > versions.env
          echo "PYTHON_VERSION=${PYTHON_VERSION}" >> versions.env
          echo "EXTRAS_MINIMOS=${EXTRAS_MINIMOS}" >> versions.env
          bash build-rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: |
            rootfs/out/rootfs-arm64.tar.zst
            rootfs/out/rootfs-arm64.tar.zst.sha256
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/rootfs-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rootfs/out/rootfs-arm64.tar.zst
            rootfs/out/rootfs-arm64.tar.zst.sha256
          generate_release_notes: true
          draft: false
          prerelease: false