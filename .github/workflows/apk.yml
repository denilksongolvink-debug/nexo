name: Build APK

on:
  workflow_dispatch:
    inputs:
      bundle_rootfs:
        description: 'Bundle rootfs from artifact (true/false)'
        required: true
        default: 'false'
        type: boolean
      hermes_ref:
        description: 'Hermes tag (must match rootfs)'
        required: true
        default: 'v0.23.0'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  HERMES_REF: ${{ github.event.inputs.hermes_ref || 'v0.23.0' }}

jobs:
  build:
    name: Build APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download rootfs artifact (if bundling)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_rootfs == 'true' || github.event_name == 'push' }}
        uses: actions/download-artifact@v4
        with:
          name: rootfs-arm64
          path: android/app/src/main/assets/
          pattern: rootfs-arm64.tar.zst*

      - name: Verify rootfs SHA256
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_rootfs == 'true' || github.event_name == 'push' }}
        run: |
          cd android/app/src/main/assets
          if [ -f rootfs-arm64.tar.zst.sha256 ]; then
            sha256sum -c rootfs-arm64.tar.zst.sha256
          else
            echo "No SHA256 file found, skipping verification"
          fi

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ github.event_name == 'push' }}
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexo-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false